name: Deploy voice-type

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prabhanshu11/voice-type

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: 72.60.218.33
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/prabhanshu11/voice-type:latest
            docker stop voice-type || true
            docker rm voice-type || true
            docker run -d \
              --name voice-type \
              --restart always \
              -p 8766:8766 \
              -e PORT=8766 \
              -e RUST_LOG=info \
              ghcr.io/prabhanshu11/voice-type:latest
            sleep 3
            curl -f http://localhost:8766/health || { docker logs voice-type; exit 1; }

            # Ensure nginx has the /voice-typing/ route
            NGINX_CONF="/etc/nginx/sites-available/prabhanshu.space"
            if ! grep -q 'voice-typing' "$NGINX_CONF" 2>/dev/null; then
              echo "Adding /voice-typing/ route to nginx..."
              # Insert before the catch-all location / block
              sed -i '/location \/ {/i \
                # Voice Type (PUBLIC)\
                location /voice-typing/ {\
                    proxy_pass http://127.0.0.1:8766/;\
                    proxy_set_header Host $host;\
                    proxy_set_header X-Real-IP $remote_addr;\
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\
                    proxy_set_header X-Forwarded-Proto $scheme;\
                    proxy_http_version 1.1;\
                    proxy_set_header Upgrade $http_upgrade;\
                    proxy_set_header Connection "upgrade";\
                    proxy_connect_timeout 60s;\
                    proxy_send_timeout 300s;\
                    proxy_read_timeout 300s;\
                }\
                location = /voice-typing {\
                    return 301 /voice-typing/;\
                }\
              ' "$NGINX_CONF"
              nginx -t && systemctl reload nginx
              echo "nginx updated with /voice-typing/ route"
            else
              echo "nginx already has /voice-typing/ route"
            fi
            echo "voice-type deployed successfully"
