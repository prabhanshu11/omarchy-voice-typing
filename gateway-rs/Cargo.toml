[package]
name = "voice-gateway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "voice-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower = "0.5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
tokio-util = "0.7"

[dev-dependencies]
wiremock = "0.6"
mockall = "0.13"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
