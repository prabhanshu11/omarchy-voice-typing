[project]
name = "voice-stt"
version = "0.1.0"
description = "Local speech-to-text for voice typing: dataset, fine-tuning, eval, serving, corrections web app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.5",
    "jiwer>=3.0",
    "soundfile>=0.12",
    "numpy",
    "requests",
    "sentencepiece",
]
